name: Validar modulo MikroTik Hotspot

on:
  pull_request:
    paths:
      - 'Modules/Mikrotik/**'
      - 'config/adminlte.php'
      - 'modules_statuses.json'
      - 'tests/Feature/MikrotikHotspotTest.php'
      - 'tests/Feature/MikrotikMigracionTest.php'
      - 'tests/Unit/MikrotikTransporteTest.php'
      - 'tests/Support/FlujoFragmentado.php'
      - '.github/workflows/mikrotik.yml'

permissions:
  contents: read

jobs:
  mikrotik:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: mikrotik_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            bootstrap
            config
            database
            Modules
            resources
            routes
            tests
            storage
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, sockets, zip, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validar sintaxis PHP
        run: find Modules/Mikrotik -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Probar fichas, cifrado, permisos y API simulada
        run: |
          vendor/bin/phpunit tests/Unit/MikrotikTransporteTest.php
          vendor/bin/phpunit tests/Feature/MikrotikHotspotTest.php

      - name: Probar actualización de MariaDB con fichas anteriores
        env:
          MIKROTIK_TEST_MYSQL: '1'
        run: vendor/bin/phpunit tests/Feature/MikrotikMigracionTest.php
