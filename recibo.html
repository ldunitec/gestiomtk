<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Recibo Caja Chica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Panel de entrada */
        .panel {
            width: 18cm;
            margin: 20px auto;
            text-align: right;
        }

        .panel input {
            padding: 5px;
            margin: 3px;
            width: 180px;
        }

        /* Recibo */
        .recibo {
            width: 18cm;
            height: auto;
            border: 1px solid #000;
            padding: 15px;
            font-size: 13px;
            box-sizing: border-box;
            margin: auto;
            
        }
        .monto {
            width: 18cm;
            height: auto;
            border: 1px solid #000;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            margin: auto;
        }
        .inmonto {
            width: 18cm;
            height: auto;
            border: 1px solid #f81313;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            margin: auto;
        }

        .titulo {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .linea {
            border-top: 1px solid #000;
            margin: 8px 0;
        }

        .firma {
            margin-top: 40px;
            text-align: center;
        }

        button {
            margin: 20px auto;
            display: block;
            padding: 8px 20px;
        }

        /* Al imprimir solo mostrar recibo */
        @media print {
            body * {
                visibility: hidden;
            }

            .recibo,
            .recibo * {
                visibility: visible;
            }

            .recibo {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            button {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- PANEL DE ENTRADA -->
    <div class="panel">
        <div class="row">
            <div class="col-md-4">Fecha: <input type="date" id="inputFecha"><br></div>
            <div class="col-md-4"> Recibí de: <input value="MEGATK" type="text" id="inputEmpresa"><br></div>
            <div class="col-md-4">Monto (L): <input type="number" id="inputMonto" step="0.01"><br></div>


            <div class="col-md-8">Concepto: <input type="text" id="inputConcepto"><br><br></div>
        </div>




    </div>

    <!-- RECIBO -->
    <div class="recibo">

        <div class="row">
            <div class="col-4"></div>
            <div class="col-4"> <div class="titulo">RECIBO</div></div>
            <div class="col-4" id="inmonto">  <div><strong>L. <span id="monto"></span></strong></div></div>
           

        </div>
        <div>Fecha: <span id="fecha"></span></div>

        <div class="linea"></div>

        <div>Recibí de:</div>
        <div><strong id="empresa"></strong></div>

        <div class="linea"></div>

        <div>Cantidad:</div>

        <div><em id="montoLetras"></em></div>

        <div class="linea"></div>

        <div>Concepto:</div>
        <div id="concepto"></div>

        <div class="firma">
            ___________________<br>
            Firma
        </div>

    </div>

    <button onclick="window.print()">Imprimir</button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script>

        // Actualizar recibo automáticamente
        document.querySelectorAll("input").forEach(input => {
            input.addEventListener("input", actualizarRecibo);
        });

        function actualizarRecibo() {

            document.getElementById("fecha").innerText = inputFecha.value;
            document.getElementById("empresa").innerText = inputEmpresa.value;
            document.getElementById("monto").innerText = parseFloat(inputMonto.value || 0).toFixed(2);
            document.getElementById("concepto").innerText = inputConcepto.value;

            document.getElementById("montoLetras").innerText =
                numeroALetras(parseFloat(inputMonto.value || 0)) + " lempiras exactos";
        }

        // Conversor básico a letras
        function numeroALetras(num) {

            const unidades = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
            const especiales = ["diez", "once", "doce", "trece", "catorce", "quince"];
            const decenas = ["", "diez", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];

            num = Math.floor(num);

            if (num < 10) return unidades[num];
            if (num >= 10 && num < 16) return especiales[num - 10];
            if (num < 20) return "dieci" + unidades[num - 10];
            if (num < 100) {
                let d = Math.floor(num / 10);
                let u = num % 10;
                return decenas[d] + (u > 0 ? " y " + unidades[u] : "");
            }
            if (num < 1000) {
                let c = Math.floor(num / 100);
                let r = num % 100;
                let centenas = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
                if (num == 100) return "cien";
                return centenas[c] + " " + numeroALetras(r);
            }

            if (num < 1000000) {
                let miles = Math.floor(num / 1000);
                let resto = num % 1000;
                return (miles == 1 ? "mil" : numeroALetras(miles) + " mil") + " " + numeroALetras(resto);
            }

            return num;
        }

        // Valores iniciales
        inputNumero.value = "CC-001";
        inputFecha.value = new Date().toISOString().split('T')[0];
        inputEmpresa.value = "MEGATK";
        inputMonto.value = 205;
        inputConcepto.value = "Compra de materiales de oficina";

        actualizarRecibo();

    </script>

</body>

</html>
