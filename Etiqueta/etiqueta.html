<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<title>Etiquetas MEDICAR</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qz-tray/2.2.4/qz-tray.min.js"></script>

<style>

.etiqueta{
    border:2px solid #000;
    background:white;
    padding:10px;
    overflow:hidden;
}

.etiqueta-6{
    width:380px;
    height:230px;
}

.etiqueta-11{
    width:380px;
    height:500px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    text-align:center;
}

.campo{
    font-size:14px;
    margin-bottom:4px;
}

</style>

</head>

<body>

<div class="container-fluid mt-3">

<div class="row">

<div class="col-md-4">

<div class="card">

<div class="card-header bg-primary text-white">
Datos de Etiqueta
</div>

<div class="card-body">

<label>Tamaño</label>

<select id="tipoEtiqueta" class="form-select mb-2">
<option value="6">1 x 6</option>
<option value="11">1 x 11</option>
</select>

<label>Fecha</label>
<input type="date" id="fecha" class="form-control mb-2">

<label>Expediente</label>
<input type="text" id="expediente" class="form-control mb-2">

<label>Nombre</label>
<input type="text" id="nombre" class="form-control mb-2">

<label>DNI</label>
<input type="text" id="dni" class="form-control mb-2">

<label>Sala</label>
<input type="text" id="sala" class="form-control mb-2">

<label>Copias</label>
<input type="number" id="copias" value="1" min="1" class="form-control mb-3">

<button class="btn btn-success w-100 mb-2" onclick="actualizarVista()">
Vista previa
</button>

<button class="btn btn-primary w-100" onclick="imprimirEtiqueta()">
Imprimir Zebra
</button>

</div>

</div>

</div>

<div class="col-md-8">

<div id="preview" class="etiqueta etiqueta-6">

<div class="logo">
MEDICAR
</div>

<hr>

<div class="campo">
<b>Fecha:</b> <span id="vFecha"></span>
</div>

<div class="campo">
<b>Expediente:</b> <span id="vExpediente"></span>
</div>

<div class="campo">
<b>Nombre:</b> <span id="vNombre"></span>
</div>

<div class="campo">
<b>DNI:</b> <span id="vDni"></span>
</div>

<div class="campo">
<b>Sala:</b> <span id="vSala"></span>
</div>

<div class="text-center mt-2">
<svg id="barcode"></svg>
</div>

<div id="qrcode" class="text-center mt-2"></div>

</div>

</div>

</div>

</div>

<script>

function actualizarVista(){

    let tipo=document.getElementById('tipoEtiqueta').value;

    let fecha=document.getElementById('fecha').value;
    let expediente=document.getElementById('expediente').value;
    let nombre=document.getElementById('nombre').value;
    let dni=document.getElementById('dni').value;
    let sala=document.getElementById('sala').value;

    document.getElementById('preview').className=
        tipo=="6"
        ? "etiqueta etiqueta-6"
        : "etiqueta etiqueta-11";

    document.getElementById('vFecha').innerText=fecha;
    document.getElementById('vExpediente').innerText=expediente;
    document.getElementById('vNombre').innerText=nombre;
    document.getElementById('vDni').innerText=dni;
    document.getElementById('vSala').innerText=sala;

    JsBarcode("#barcode", expediente,{
        format:"CODE128",
        width:2,
        height:70,
        displayValue:true
    });

    document.getElementById('qrcode').innerHTML="";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text:
            "EXP:"+expediente+
            "|DNI:"+dni+
            "|NOMBRE:"+nombre,
            width:120,
            height:120
        }
    );
}

function generarZPL(){

    let fecha=document.getElementById('fecha').value;
    let expediente=document.getElementById('expediente').value;
    let nombre=document.getElementById('nombre').value;
    let dni=document.getElementById('dni').value;
    let sala=document.getElementById('sala').value;
    let copias=document.getElementById('copias').value;
    let tipo=document.getElementById('tipoEtiqueta').value;

    let largo=tipo=="6" ? 1200 : 2200;

    return `
^XA
^PW800
^LL${largo}
^PQ${copias}

^FO20,20
^A0N,45,45
^FDMEDICAR^FS

^FO20,90
^A0N,30,30
^FDFecha: ${fecha}^FS

^FO20,140
^A0N,30,30
^FDExpediente: ${expediente}^FS

^FO20,190
^A0N,30,30
^FDNombre: ${nombre}^FS

^FO20,240
^A0N,30,30
^FDDNI: ${dni}^FS

^FO20,290
^A0N,30,30
^FDSala: ${sala}^FS

^FO20,360
^BY3,2,100
^BCN,100,Y,N,N
^FD${expediente}^FS

^FO500,80
^BQN,2,6
^FDLA,EXP:${expediente},DNI:${dni}^FS

^XZ
`;
}

async function imprimirEtiqueta(){

    try{

        let zpl=generarZPL();

        await qz.websocket.connect();

        let printer=
            await qz.printers.find("ZDesigner ZD510");

        let config=
            qz.configs.create(printer);

        await qz.print(config,[zpl]);

        await qz.websocket.disconnect();

        alert("Etiqueta enviada correctamente");

    }catch(error){

        console.error(error);

        alert("Error al imprimir: "+error);

    }

}

actualizarVista();

</script>

</body>
</html>
